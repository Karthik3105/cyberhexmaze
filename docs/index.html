<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyMaze - Cyber Hex Puzzle Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #f7b731, #fc5c65, #a55eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #b0b0b0;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-block;
            padding: 0.7rem 2rem;
            background: linear-gradient(135deg, #a55eea, #fc5c65);
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
        }
        .links {
            margin-top: 2rem;
        }
        .links a {
            color: #a55eea;
            margin: 0 1rem;
            text-decoration: none;
        }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐝 HoneyMaze</h1>
        <p>Navigate through challenging hexagonal mazes in this exciting cyber puzzle game. Test your skills, compete with friends, and conquer increasingly complex levels!</p>
        <a class="badge" href="https://play.google.com/store/apps/details?id=com.Karthik.HoneyCombMaze">Get it on Google Play</a>
        <div class="links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-service.html">Terms of Service</a>
        </div>
    </div>
</body>
</html>
